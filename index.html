<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ties - Privacy-First Relationship Manager</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #152111 0%, #1E2B19 100%);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #49E619;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            color: #B8C4B3;
            margin-bottom: 30px;
        }
        .links {
            margin-top: 40px;
        }
        a {
            display: inline-block;
            margin: 10px;
            padding: 12px 30px;
            background: #49E619;
            color: #152111;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s, background 0.2s;
        }
        a:hover {
            transform: translateY(-2px);
            background: #5AFF2A;
        }
        .footer {
            margin-top: 60px;
            font-size: 0.9em;
            color: #6A7A64;
        }

            <br>All your data stays encrypted on your device. No cloud, no tracking.
